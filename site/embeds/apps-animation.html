<!doctype html>
<!--
  Littlebird "An assistant across all your apps" section animation.
  Self-contained: inline CSS/JS/SVG, brand font base64-embedded, zero network requests.

  The large white circle is the stage: the ring of app logos rotates along the arc
  to bring each beat's app into it, then the composer sends a prompt to that app.

  Embedding: host this file (own origin / S3 / CDN) and drop it in as an iframe:

    <iframe src="https://…/apps-animation.html"
            title="Littlebird sending tasks to Linear, Gmail, Slack, and Notion"
            loading="lazy"
            style="width:100%; aspect-ratio:583/604; border:0"></iframe>

  The 583×604 design canvas scales to the iframe width.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Littlebird — across all your apps</title>
<style>
  :root {
    --bg: #fffdf5;
    --chip-bg: #fffae9;
    --chip-border: rgba(0, 0, 0, .1);
    --card-border: #eae6d7;
    --ghost: rgba(234, 231, 222, .5);
    --fg: #1b1c14;
    --fg-subtle: #646464;
    --fg-muted: #838383;
    --pill: #00694e;
    --dots: #c9c0a8;
    --ease-out: cubic-bezier(.215, .61, .355, 1);
    --ease-in-out: cubic-bezier(.645, .045, .355, 1);
    --pop: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: 'Sohne', -apple-system, 'Segoe UI', sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  .embed { width: 100%; aspect-ratio: 583 / 604; position: relative; overflow: hidden; }
  .canvas {
    position: absolute; top: 0; left: 0;
    width: 583px; height: 604px;
    transform-origin: 0 0;
  }

  /* ---------- icon ring ---------- */
  .chip {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: 50%;
    translate: 0 0;
    animation: drift var(--dd, 9s) ease-in-out var(--dl, 0s) infinite alternate;
    transition: left .4s var(--ease-in-out), top .4s var(--ease-in-out),
                width .4s var(--ease-in-out), height .4s var(--ease-in-out),
                transform .35s var(--ease-out), box-shadow .35s var(--ease-out),
                border-color .35s var(--ease-out), background-color .35s ease, opacity .35s ease;
  }
  .chip img, .chip svg { display: block; transition: width .4s var(--ease-in-out), height .4s var(--ease-in-out); }
  .chip.hero {
    background: #fff;
    box-shadow: 0 15px 15px -7.5px rgba(0, 61, 61, .04), 0 7.5px 7.5px -3.7px rgba(0, 61, 61, .04),
                0 3.7px 3.7px -1.9px rgba(0, 61, 61, .04), 0 1.2px 1.2px -.6px rgba(0, 31, 31, .08);
  }
  .chip[data-logo="linear"] svg { transform: rotate(2deg); }
  @keyframes drift { from { translate: 0 -3px; } to { translate: 0 3px; } }

  .chip.lit {
    transform: scale(1.08);
    border-color: rgba(0, 105, 78, .35);
    box-shadow: 0 0 0 5px rgba(0, 105, 78, .12), 0 0 0 1.5px rgba(0, 105, 78, .3),
                0 10px 24px rgba(0, 61, 61, .1);
  }
  .arc.focus .chip:not(.lit) { opacity: .65; }

  /* ---------- connector ---------- */
  .conns { position: absolute; inset: 0; pointer-events: none; }
  .conn-dots {
    fill: none; stroke: var(--dots); stroke-width: 2;
    stroke-linecap: round; stroke-dasharray: 4 5;
    opacity: 0; transition: opacity .3s ease;
  }
  .conn-dots.on { opacity: 1; }
  .conn-reveal { fill: none; stroke: #fff; stroke-width: 10; stroke-dasharray: 1 1; stroke-dashoffset: 1; }

  /* ---------- chat history ---------- */
  .history { position: absolute; left: 16px; top: 103px; width: 402px; height: 146px; }
  .pair {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 20px;
    transition: transform .5s var(--ease-in-out), opacity .5s ease;
  }
  .pair.enter { transform: translateY(18px); opacity: 0; }
  .pair.out { transform: translateY(-26px); opacity: 0 !important; }
  .hb-user {
    align-self: flex-end; opacity: .4;
    background: var(--ghost); border-radius: 10px;
    max-width: 300px; padding: 8px 14px;
    font-size: 14.5px; line-height: 19px; color: var(--fg);
  }
  .hb-user.block { width: 230px; height: 35px; padding: 0; }
  .hb-resp { align-self: flex-start; opacity: .6; background: var(--ghost); border-radius: 10px; width: 297px; height: 91px; }

  /* ---------- composer ---------- */
  .composer {
    position: absolute; left: 16px; top: 269px; width: 402px;
    display: flex; flex-direction: column; gap: 12px;
    background: #fff; border: 1px solid var(--card-border); border-radius: 19px;
    padding: 17px 16px 13px;
    box-shadow: 0 12.6px 12.6px rgba(0, 61, 61, .04), 0 1px 1px rgba(0, 31, 31, .08);
  }
  .prompt {
    min-height: 68px; padding: 0 5px;
    font-size: 20px; line-height: 34px; letter-spacing: .48px; color: var(--fg);
    transition: transform .5s var(--ease-in-out), opacity .45s ease;
  }
  .prompt.lift { transform: translateY(-130px) scale(.94); opacity: 0; }
  .composer.typing .prompt::after {
    content: ''; display: inline-block; width: 2px; height: 22px;
    margin-left: 2px; vertical-align: -4px;
    background: var(--fg); animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .composer-row { display: flex; align-items: center; }
  .btn-plus {
    width: 46px; height: 46px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1.7px solid var(--card-border); border-radius: 12px; background: none;
  }
  .btn-plus svg { width: 24px; height: 24px; }
  .composer-row .spacer { flex: 1; }
  .btn-mic { width: 24px; height: 24px; margin-right: 12px; }
  .send {
    width: 48px; height: 48px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: #202020; border-radius: 50%; opacity: .75;
    transition: opacity .25s ease, transform .2s var(--ease-out);
  }
  .send svg { width: 24px; height: 24px; }
  .send.armed { opacity: 1; transform: scale(1.04); }
  .send.fired { transform: scale(.92); }

  /* ---------- wordmark + edge fades ---------- */
  .wordmark { position: absolute; left: 32px; top: 453px; width: 106px; height: 22px; }
  .fade { position: absolute; right: 0; width: 567px; height: 155px; pointer-events: none; }
  .fade-top { top: 0; background: linear-gradient(to bottom, #fffdf5, rgba(255, 253, 245, 0)); }
  .fade-bot { bottom: 0; background: linear-gradient(to top, #fffdf5, rgba(255, 253, 245, 0)); }

  .notransition, .notransition * { transition: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .chip { animation: none; }
    .composer.typing .prompt::after { animation: none; }
  }
</style>
</head>

<script>
(() => {
  'use strict';
  const reduceMq = matchMedia('(prefers-reduced-motion: reduce)');

  const canvas = document.querySelector('.canvas');
  const arc = document.querySelector('.arc');
  const composer = document.querySelector('.composer');
  const promptEl = composer.querySelector('.prompt');
  const sendEl = composer.querySelector('.send');
  const historyEl = document.querySelector('.history');
  const connEl = document.querySelector('.conn-dots');
  const revealEl = document.querySelector('.conn-reveal');

  // arc slots top→bottom; slot 4 is the hero stage the ring rotates into
  const SLOTS = [[105, 14, 43], [172, 19, 55], [254, 40, 68], [349, 73, 85],
                 [432, 157, 108], [474, 298, 85], [480, 416, 68], [461, 517, 55]];
  const ICON = [24, 30, 37, 47, 60, 47, 37, 30];
  const HERO = 4;

  // the four target apps occupy adjacent slots 2-5 around the hero stage and
  // rotate one hop per beat (4 hops = identity); the other chips stay put
  const ROT = [2, 3, 4, 5];
  const allChips = Array.from(arc.querySelectorAll('.chip'));
  let rot = ROT.map(i => allChips[i]);
  const initialRot = [...rot];

  function applySlot(chip, i) {
    const [x, y, s] = SLOTS[i];
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    chip.style.width = s + 'px';
    chip.style.height = s + 'px';
    const inner = chip.querySelector('img, svg');
    inner.style.width = ICON[i] + 'px';
    inner.style.height = ICON[i] + 'px';
    chip.classList.toggle('hero', i === HERO);
  }

  function stepRotate() {
    const wrap = rot.pop();
    rot.unshift(wrap);
    rot.forEach((chip, i) => {
      if (chip === wrap) return;
      applySlot(chip, ROT[i]);
    });
    // the chip below the stage re-enters at the cluster's top: fade, jump, fade back
    wrap.style.opacity = '0';
    setTimeout(() => {
      wrap.classList.add('notransition');
      applySlot(wrap, ROT[rot.indexOf(wrap)]);
      void wrap.offsetWidth;
      wrap.classList.remove('notransition');
      wrap.style.opacity = '';
    }, 260);
  }

  const heroChip = () => rot[ROT.indexOf(HERO)];
  const rotateIfNeeded = key => { if (heroChip().dataset.logo !== key) stepRotate(); };

  const BEATS = [
    { key: 'linear', text: 'Update Linear board with my work from this morning' },
    { key: 'gmail', text: "Reply to Sarah's email about the launch timeline" },
    { key: 'slack', text: 'Post the standup summary in #team' },
    { key: 'notion', text: "Save today's meeting notes to Notion" },
  ];
  const initialHistoryHTML = historyEl.innerHTML;

  promptEl._n = 0;
  function typePrompt(text) {
    return p => {
      // slight nonlinearity so the typing cadence reads human, monotonic via _n
      const jitter = 0.4 * Math.sin(p * 29) * p * (1 - p);
      let count = Math.floor(Math.min(1, Math.max(0, p + jitter)) * text.length);
      if (p >= 1) count = text.length;
      promptEl._n = Math.max(promptEl._n, count);
      promptEl.textContent = text.slice(0, promptEl._n);
    };
  }

  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const drawConn = p => { revealEl.style.strokeDashoffset = 1 - easeOutCubic(p); };

  function pushHistory() {
    historyEl.querySelectorAll('.pair.out').forEach(el => el.remove());
    const old = historyEl.querySelector('.pair');
    if (old) {
      old.classList.add('out');
      setTimeout(() => old.remove(), 600);
    }
    const pair = document.createElement('div');
    pair.className = 'pair enter';
    const user = document.createElement('div');
    user.className = 'hb-user block';
    const resp = document.createElement('div');
    resp.className = 'hb-resp';
    pair.append(user, resp);
    historyEl.appendChild(pair);
    requestAnimationFrame(() => requestAnimationFrame(() => pair.classList.remove('enter')));
  }

  function clearPrompt() {
    promptEl.classList.add('notransition');
    promptEl._n = 0;
    promptEl.textContent = '';
    promptEl.classList.remove('lift');
    void promptEl.offsetWidth;
    promptEl.classList.remove('notransition');
  }

  // global speed multiplier — timeline literals below are authored at 1.0
  const TEMPO = 0.7;
  const s = (at, fn) => ({ at: at * TEMPO, fn });
  const sp = (at, dur, update) => ({ at: at * TEMPO, dur: dur * TEMPO, update });

  let activeChip = null;
  const BEAT = 6500;
  const steps = [];
  BEATS.forEach((b, i) => {
    const t = i * BEAT;
    steps.push(
      s(t + 50, () => rotateIfNeeded(b.key)),
      s(t + 500, () => rotateIfNeeded(b.key)),
      s(t + 1000, () => composer.classList.add('typing')),
      sp(t + 1200, 2000, typePrompt(b.text)),
      s(t + 3300, () => sendEl.classList.add('armed')),
      s(t + 3600, () => { sendEl.classList.add('fired'); connEl.classList.add('on'); }),
      sp(t + 3600, 600, drawConn),
      s(t + 3800, () => sendEl.classList.remove('fired')),
      s(t + 3900, () => { activeChip = heroChip(); activeChip.classList.add('lit'); arc.classList.add('focus'); }),
      s(t + 5200, () => { composer.classList.remove('typing'); promptEl.classList.add('lift'); }),
      s(t + 5500, () => pushHistory()),
      s(t + 5750, () => { clearPrompt(); sendEl.classList.remove('armed'); }),
      s(t + 5950, () => {
        connEl.classList.remove('on');
        revealEl.style.strokeDashoffset = 1;
        if (activeChip) activeChip.classList.remove('lit');
        arc.classList.remove('focus');
      }),
    );
  });
  const DUR = BEATS.length * BEAT * TEMPO;
  steps.sort((a, b) => a.at - b.at);

  function resetBeatState() {
    composer.classList.remove('typing');
    sendEl.classList.remove('armed', 'fired');
    clearPrompt();
    arc.classList.remove('focus');
    connEl.classList.remove('on');
    revealEl.style.strokeDashoffset = 1;
    allChips.forEach(chip => chip.classList.remove('lit'));
    activeChip = null;
  }

  function resetRing() {
    rot = [...initialRot];
    rot.forEach((chip, i) => {
      chip.classList.add('notransition');
      chip.style.opacity = '';
      applySlot(chip, ROT[i]);
      void chip.offsetWidth;
      chip.classList.remove('notransition');
    });
  }

  function resetAll() {
    resetBeatState();
    resetRing();
    historyEl.innerHTML = initialHistoryHTML;
    elapsed = 0; stepIdx = 0; activeSpans = [];
  }

  let elapsed = 0, stepIdx = 0, activeSpans = [];
  let last = performance.now();
  let hoverPause = false, hiddenPause = false, apiPause = false;
  const isPaused = () => hoverPause || hiddenPause || apiPause;

  function applyReducedState() {
    resetAll();
    promptEl.textContent = BEATS[0].text;
    sendEl.classList.add('armed');
  }

  function frame(now) {
    const dt = Math.min(now - last, 64);
    last = now;
    if (!isPaused() && !reduceMq.matches) {
      elapsed += dt;
      while (stepIdx < steps.length && steps[stepIdx].at <= elapsed) {
        const step = steps[stepIdx++];
        if (step.fn) step.fn(); else activeSpans.push(step);
      }
      for (let i = activeSpans.length - 1; i >= 0; i--) {
        const span = activeSpans[i];
        const p = Math.min(1, (elapsed - span.at) / span.dur);
        span.update(p);
        if (p >= 1) activeSpans.splice(i, 1);
      }
      // loop seam: ring and history carry the last beat's state into the next cycle
      if (elapsed >= DUR) {
        resetBeatState();
        elapsed = 0; stepIdx = 0; activeSpans = [];
      }
    }
    requestAnimationFrame(frame);
  }

  const embed = document.querySelector('.embed');
  embed.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') hoverPause = true; });
  embed.addEventListener('pointerleave', () => { hoverPause = false; });
  document.addEventListener('visibilitychange', () => { hiddenPause = document.hidden; });

  new ResizeObserver(entries => {
    canvas.style.transform = `scale(${entries[0].contentRect.width / 583})`;
  }).observe(embed);

  function seek(ms) {
    canvas.classList.add('notransition');
    resetAll();
    elapsed = ms;
    while (stepIdx < steps.length && steps[stepIdx].at <= ms) {
      const step = steps[stepIdx++];
      if (step.fn) { step.fn(); continue; }
      const p = Math.min(1, (ms - step.at) / step.dur);
      if (p >= 1) step.update(1); else { step.update(p); activeSpans.push(step); }
    }
    void canvas.offsetWidth;
    canvas.classList.remove('notransition');
  }

  window.__apps = {
    pause() { apiPause = true; },
    play() { apiPause = false; },
    seek,
    finish() { seek(DUR - 1); },
    get state() { return { elapsed, paused: isPaused(), hero: heroChip().dataset.logo }; },
  };

  reduceMq.addEventListener('change', () => { reduceMq.matches ? applyReducedState() : resetAll(); });
  if (reduceMq.matches) applyReducedState(); else resetAll();
  requestAnimationFrame(frame);
})();
</script>
